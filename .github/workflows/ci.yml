name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * *" # 07:00 en Lima
  workflow_dispatch:

permissions:
  contents: read

# Acciones fijadas por SHA (el comentario indica la versión); Dependabot las actualiza.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libxml2-utils # xmllint: valida el CAP contra el XSD
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
        env:
          REQUIRE_XMLLINT: "1" # en CI la validación CAP no se puede saltar

  # El paquete publicado corre en Node: probamos el build en cada versión soportada (engines >= 20).
  humo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/humo.mjs

  # Diario: detecta pronto si el SENAMHI cambió su publicación (no bloquea PRs).
  fuente:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun src/bin.ts doctor --json
