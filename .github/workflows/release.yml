name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Node 24 trae npm >= 11.5, requerido por trusted publishing.
      # Sin registry-url: no hace falta .npmrc ni token; npm se autentica por OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: La versión del tag coincide con package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepublishOnly corre typecheck, tests, build y la prueba de humo del paquete compilado.
      - run: npm publish --provenance --access public
